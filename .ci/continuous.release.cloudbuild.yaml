steps:
  - id: "build-docker"
    name: "us-central1-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/gcr.io/cloud-builders/docker@sha256:001fb4a870a84485cf198c80002f7af42f6456f2dbc261d70a0b5f0111470df4"
    waitFor: ['-']
    script: |
        #!/usr/bin/env bash
        docker buildx create --name container-builder --driver docker-container --bootstrap --use

        export TAGS="-t ${_DOCKER_URI}:$SHORT_SHA -t ${_DOCKER_URI}:$REF_NAME"
        docker buildx build --platform linux/amd64,linux/arm64 --build-arg _AR_REPO_NAME=${_AR_REPO_NAME} --build-arg PROJECT_ID=${PROJECT_ID} --build-arg COMMIT_SHA=$(git rev-parse --short HEAD) $TAGS --push .

  - id: "install-dependencies"
    name: "us-central1-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/golang:1@sha256:3680233e3204827fbdc66088528ae6d4b3d034f51d03a99d454f6de034888244"
    waitFor: ['-']
    env:
      - 'GOPATH=/gopath'
    volumes:
      - name: 'go'
        path: '/gopath'
    script: |
        go get -d ./...

  - id: "install-zig"
    name: "us-central1-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/golang:1@sha256:3680233e3204827fbdc66088528ae6d4b3d034f51d03a99d454f6de034888244"
    waitFor: ['-']
    volumes:
      - name: 'zig'
        path: '/zig-tools'
    script: |
        #!/usr/bin/env bash
        set -e
        apt-get update && apt-get install -y xz-utils
        curl -fL "https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz" -o zig.tar.xz
        tar -xf zig.tar.xz -C /zig-tools --strip-components=1

  - id: "install-macos-sdk"
    name: "gcr.io/cloud-builders/gcloud:latest"
    waitFor: ['-']
    volumes:
      - name: 'macos-sdk'
        path: '/macos-sdk'
    script: |
        #!/usr/bin/env bash
        set -e
        apt-get update && apt-get install -y xz-utils
        echo "Downloading macOS 14.5 SDK..."
        gcloud storage cp gs://${_ASSETS_BUCKET}/MacOSX14.5.tar.xz sdk.tar.xz

        mkdir -p /macos-sdk/MacOSX14.5.sdk
        echo "Unpacking macOS 14.5 SDK..."
        tar -xf sdk.tar.xz -C /macos-sdk/MacOSX14.5.sdk --strip-components=1

  - id: "build-linux-amd64"
    name: "us-central1-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/golang:1@sha256:3680233e3204827fbdc66088528ae6d4b3d034f51d03a99d454f6de034888244"
    waitFor:
      - "install-dependencies"
      - "install-zig"
    env:
      - 'GOPATH=/gopath'
      - 'CGO_ENABLED=1'
      - 'GOOS=linux'
      - 'GOARCH=amd64'
      - 'CC=/zig-tools/zig cc -target x86_64-linux-gnu'
      - 'CXX=/zig-tools/zig c++ -target x86_64-linux-gnu'
    volumes:
      - name: 'go'
        path: '/gopath'
      - name: 'zig'
        path: '/zig-tools'
    script: |
        #!/usr/bin/env bash
        go build -ldflags "-X github.com/googleapis/mcp-toolbox/cmd.commitSha=$(git rev-parse --short HEAD)" -o toolbox.linux.amd64

  - id: "store-linux-amd64"
    name: "gcr.io/cloud-builders/gcloud:latest"
    waitFor:
      - "build-linux-amd64"
    script: |
        #!/usr/bin/env bash
        gcloud storage cp toolbox.linux.amd64 gs://$_BUCKET_NAME/$REF_NAME/linux/amd64/toolbox

  - id: "build-linux-amd64-geminicli"
    name: "us-central1-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/golang:1@sha256:3680233e3204827fbdc66088528ae6d4b3d034f51d03a99d454f6de034888244"
    waitFor:
      - "install-dependencies"
      - "install-zig"
    env:
      - 'GOPATH=/gopath'
      - 'CGO_ENABLED=1'
      - 'GOOS=linux'
      - 'GOARCH=amd64'
      - 'CC=/zig-tools/zig cc -target x86_64-linux-gnu'
      - 'CXX=/zig-tools/zig c++ -target x86_64-linux-gnu'
    volumes:
