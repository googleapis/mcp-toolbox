# Evals for prebuilt tool configs, exercised through coding-agent harnesses.
#
# One step per prebuilt config. Adding a database means adding a step, its
# evalset, and its credentials on the trigger. EVAL_HARNESSES is a
# space-separated list of basenames under evals/model_configs, run in turn;
# steps inherit _EVAL_HARNESSES unless they set their own.

steps:
  # Narrows a pull request run to the databases it touched. Empty on a scheduled
  # build, which run_evals.sh runs in full.
  - id: "detect-changes"
    name: "gcr.io/cloud-builders/git"
    waitFor: ["-"]
    entrypoint: "bash"
    args:
      - -c
      - |
        # Cloud Build has no label filter, so the opt-in gate lives here. It
        # covers the maintainer pull requests that build without a /gcbrun too.
        # Empty _PR_NUMBER is a scheduled build, which is ungated.
        if [ -n "$_PR_NUMBER" ] &&
           ! curl -sfL "https://api.github.com/repos/googleapis/mcp-toolbox/issues/$_PR_NUMBER/labels" |
             grep -q '"name": *"evals: run"'; then
          echo "pull request #$_PR_NUMBER is not labelled 'evals: run'; skipping"
          touch /workspace/skip-evals
          exit 0
        fi

        # Blobless: --name-only needs tree entries, not file contents.
        git fetch --unshallow --filter=blob:none || true
        git fetch --filter=blob:none origin main > /dev/null 2>&1
        git diff --name-only origin/main...HEAD > /workspace/changed_files.txt
        cat /workspace/changed_files.txt

  - id: "build-toolbox"
    name: golang:1
    waitFor: ["detect-changes"]
    env:
      - "CGO_ENABLED=1"  # godror does not build without cgo
    script: |
      bash /workspace/.ci/run_evals.sh --check-any || exit 0
      go build -o /workspace/toolbox .
      /workspace/toolbox --version

  # Warms the worker's shared Docker cache while the build compiles, so the
  # eval steps start on a local image instead of each fronting the pull.
  - id: "pull-evalbench"
    name: "${_EVALBENCH_IMAGE}"
    waitFor: ["-"]
    entrypoint: "true"

  - id: "evals-cloud-sql-postgres"
    name: "${_EVALBENCH_IMAGE}"
    waitFor: ["build-toolbox", "pull-evalbench"]
    dir: /evalbench
    entrypoint: bash
    args: ["/workspace/.ci/run_evals.sh"]
    allowFailure: true
    env:
      - "TOOLBOX_PREBUILT=cloud-sql-postgres"
      - "EVAL_DATASET=evals/evalsets/cloud-sql-postgres.json"
      - "EVAL_ENV_PREFIX=CLOUD_SQL_POSTGRES"
      - "EVAL_HARNESSES=claude_cli gemini_cli"

      - "CLOUD_SQL_POSTGRES_PROJECT=$PROJECT_ID"
      - "CLOUD_SQL_POSTGRES_REGION=${_REGION}"
      - "CLOUD_SQL_POSTGRES_INSTANCE=${_CLOUD_SQL_POSTGRES_INSTANCE}"
      - "CLOUD_SQL_POSTGRES_DATABASE=${_DATABASE_NAME}"
      - "CLOUD_SQL_POSTGRES_IP_TYPE=${_CLOUD_SQL_IP_TYPE}"
    secretEnv:
      - "CLOUD_SQL_POSTGRES_USER"
      - "CLOUD_SQL_POSTGRES_PASSWORD"

  - id: "evals-cloud-sql-mysql"
    name: "${_EVALBENCH_IMAGE}"
    waitFor: ["build-toolbox", "pull-evalbench"]
    dir: /evalbench
    entrypoint: bash
    args: ["/workspace/.ci/run_evals.sh"]
    allowFailure: true
    env:
      - "TOOLBOX_PREBUILT=cloud-sql-mysql"
      - "EVAL_DATASET=evals/evalsets/cloud-sql-mysql.json"
      - "EVAL_ENV_PREFIX=CLOUD_SQL_MYSQL"

      - "CLOUD_SQL_MYSQL_PROJECT=$PROJECT_ID"
      - "CLOUD_SQL_MYSQL_REGION=${_REGION}"
      - "CLOUD_SQL_MYSQL_INSTANCE=${_CLOUD_SQL_MYSQL_INSTANCE}"
      - "CLOUD_SQL_MYSQL_DATABASE=${_DATABASE_NAME}"
      - "CLOUD_SQL_MYSQL_IP_TYPE=${_CLOUD_SQL_IP_TYPE}"
    secretEnv:
      - "CLOUD_SQL_MYSQL_USER"
      - "CLOUD_SQL_MYSQL_PASSWORD"

  # These evals create real backups and the toolbox has no delete tool, so the
  # TEARDOWN_ variables drive evals/teardown/, which EvalBench runs after each
  # harness.
  #
  # No secretEnv: the cloud-sql-admin source authenticates through ADC. Only
  # three CLOUD_SQL_POSTGRES_ variables are set, so run_evals.sh's prefix check
  # does not see an empty user or password.
  - id: "evals-cloud-sql-postgres-admin"
    name: "${_EVALBENCH_IMAGE}"
    waitFor: ["build-toolbox", "pull-evalbench"]
    dir: /evalbench
    entrypoint: bash
    args: ["/workspace/.ci/run_evals.sh"]
    allowFailure: true
    env:
      - "TOOLBOX_PREBUILT=cloud-sql-postgres-admin"
      - "EVAL_DATASET=evals/evalsets/cloud-sql-postgres-admin.json"
      - "EVAL_ENV_PREFIX=CLOUD_SQL_POSTGRES"

      - "TEARDOWN_PROJECT=$PROJECT_ID"
      - "TEARDOWN_INSTANCE=${_CLOUD_SQL_POSTGRES_INSTANCE}"

      - "CLOUD_SQL_POSTGRES_PROJECT=$PROJECT_ID"
      - "CLOUD_SQL_POSTGRES_REGION=${_REGION}"
      - "CLOUD_SQL_POSTGRES_INSTANCE=${_CLOUD_SQL_POSTGRES_INSTANCE}"

  # No secretEnv: the source authenticates through ADC. BIGQUERY_READONLY is
  # load-bearing, not hygiene -- an empty writeMode defaults to "allowed", which
  # would give execute_sql DROP rights over everything the build service account
  # can reach. Setting BIGQUERY_WRITE_MODE as well would be rejected as a
  # conflicting pair.
  #
  # The evalset reads a dataset that evals/setup/bigquery.sh seeds per build.
  - id: "evals-bigquery"
    name: "${_EVALBENCH_IMAGE}"
    waitFor: ["build-toolbox", "pull-evalbench"]
    dir: /evalbench
    entrypoint: bash
    args: ["/workspace/.ci/run_evals.sh"]
    allowFailure: true
    env:
      - "TOOLBOX_PREBUILT=bigquery"
      - "EVAL_DATASET=evals/evalsets/bigquery.json"
      - "EVAL_ENV_PREFIX=BIGQUERY"

      - "BIGQUERY_PROJECT=$PROJECT_ID"
      - "BIGQUERY_LOCATION=US"
      - "BIGQUERY_READONLY=true"

  # Turns the allowFailure steps back into a red build. No waitFor, which means
  # every step above, so a new database needs no edit here.
  - id: "report-failures"
    name: "gcr.io/cloud-builders/git"
    entrypoint: bash
    args:
      - -c
      - |
        if ls /workspace/failed-* > /dev/null 2>&1; then
          echo "evals failed:"
          ls /workspace/failed-*
          exit 1
        fi

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/cloud_sql_pg_user/versions/latest
      env: CLOUD_SQL_POSTGRES_USER
    - versionName: projects/$PROJECT_ID/secrets/cloud_sql_pg_pass/versions/latest
      env: CLOUD_SQL_POSTGRES_PASSWORD
    - versionName: projects/$PROJECT_ID/secrets/cloud_sql_mysql_user/versions/latest
      env: CLOUD_SQL_MYSQL_USER
    - versionName: projects/$PROJECT_ID/secrets/cloud_sql_mysql_pass/versions/latest
      env: CLOUD_SQL_MYSQL_PASSWORD

# env here is shared by every step. EVAL_REPORTING_PROJECT is required from the
# trigger: results are never written to the build project.
options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: "ALLOW_LOOSE"
  dynamicSubstitutions: true
  # Steps share one worker, so databases evaluated in parallel contend for the
  # same CPU.
  machineType: E2_HIGHCPU_32
  env:
    - "TOOLBOX_BIN=/workspace/toolbox"
    # A substitution, not an env var, so run_evals.sh cannot read it otherwise.
    - "BUILD_ID=$BUILD_ID"
    - "EVAL_HARNESSES=${_EVAL_HARNESSES}"
    - "EVAL_GEMINI_MODEL=${_GEMINI_MODEL}"
    - "EVAL_CLAUDE_MODEL=${_CLAUDE_MODEL}"
    - "EVAL_GCP_PROJECT_ID=$PROJECT_ID"
    - "EVAL_REPORTING_PROJECT=${_EVAL_REPORTING_PROJECT}"
    - "EVAL_GROUP=${_EVAL_GROUP}"
    - "EVAL_GCP_PROJECT_REGION=${_VERTEX_LOCATION}"
    - "UV_CACHE_DIR=/tmp/uv-cache"

timeout: 7200s

# Everything not defined here comes from the trigger; run_evals.sh fails the
# step when one is missing.
substitutions:
  _EVAL_HARNESSES: "claude_cli"
  # Presubmit runs override this so their rows stay out of the scheduled runs.
  _EVAL_GROUP: "mcp-toolbox"
  _GEMINI_MODEL: "gemini-3.7-flash"
  _CLAUDE_MODEL: "claude-opus-4-8"
  _EVALBENCH_IMAGE: "us-central1-docker.pkg.dev/cloud-db-nl2sql/evalbench/eval_server:latest"
