steps:

  - id: "download-dependencies"
    name: "gcr.io/cloud-builders/gcloud:latest"
    waitFor: ['-']
    script: |
        #!/usr/bin/env bash
        set -e
        # Download zig for docker build and cross-compilation
        gcloud storage cp gs://toolbox-build-assets/dependencies/zig-x86_64-linux-0.15.2.tar.xz ./zig.tar.xz
        echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  ./zig.tar.xz" | sha256sum -c -

  - id: "install-dependencies"
    name: "us-central1-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/golang:1@sha256:3680233e3204827fbdc66088528ae6d4b3d034f51d03a99d454f6de034888244"
    waitFor: ["download-dependencies"]
    env:
      - "GOPATH=/gopath"
    volumes:
      - name: "go"
        path: "/gopath"
    script: |
      go get -d ./...

  - id: "run-tests"
    name: "us-central1-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/golang:1@sha256:3680233e3204827fbdc66088528ae6d4b3d034f51d03a99d454f6de034888244"
    waitFor:
      - "install-dependencies"
    env:
      - "GOPATH=/gopath"
    volumes:
      - name: "go"
        path: "/gopath"
    script: |
      #!/usr/bin/env bash
      set -eo pipefail

      echo "Installing go-junit-report..."
      go install github.com/jstemmer/go-junit-report/v2@v2.1.0

      echo "Running unit tests and generating JUnit XML report..."
      go test -race -v ./cmd/... ./internal/... 2>&1 | tee /dev/stderr | $(go env GOPATH)/bin/go-junit-report -set-exit-code > in-progress-junit-report.xml

      # If the previous command failed, this will never be renamed and thus not uploaded
      mv in-progress-junit-report.xml junit-report.xml

  - id: "build-docker"
    name: "us-central1-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/gcr.io/cloud-builders/docker@sha256:001fb4a870a84485cf198c80002f7af42f6456f2dbc261d70a0b5f0111470df4"
    waitFor:
      - "run-tests"
    script: |
      #!/usr/bin/env bash
      set -e
      export VERSION=$(cat ./cmd/version.txt)
      docker buildx create --name container-builder --driver docker-container --bootstrap --use

      export TAGS="-t ${_DOCKER_URI}:$VERSION"
      if [[ "$_PUSH_LATEST" == "true" ]]; then
        export TAGS="$TAGS -t ${_DOCKER_URI}:latest"
      fi

      # Build and push
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --build-arg BUILD_TYPE=container.release \
        --build-arg _AR_REPO_NAME=${_AR_REPO_NAME} --build-arg PROJECT_ID=${PROJECT_ID} --build-arg COMMIT_SHA=$(git rev-parse --short HEAD) \
        $TAGS \
        --push .

      # Pull the image to ensure it's available for provenance generation.
      docker pull ${_DOCKER_URI}:${VERSION}
      docker tag ${_DOCKER_URI}:${VERSION} ${_DOCKER_URI}:latest

  - id: "install-zig"
    name: "us-central1-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/golang:1@sha256:3680233e3204827fbdc66088528ae6d4b3d034f51d03a99d454f6de034888244"
    waitFor: ["download-dependencies"]
    volumes:
      - name: "zig"
        path: "/zig-tools"
    script: |
      #!/usr/bin/env bash
      set -e
      apt-get update && apt-get install -y xz-utils
      tar -xf ./zig.tar.xz -C /zig-tools --strip-components=1

  - id: "install-macos-sdk"
    name: "gcr.io/cloud-builders/gcloud:latest"
    waitFor: ["download-dependencies"]
    volumes:
      - name: "macos-sdk"
        path: "/macos-sdk"
    script: |
      #!/usr/bin/env bash
      set -e
      apt-get update && apt-get install -y xz-utils
      echo "Downloading macOS 14.5 SDK..."
      gcloud storage cp gs://${_ASSETS_BUCKET}/MacOSX14.5.tar.xz sdk.tar.xz

      mkdir -p /macos-sdk/MacOSX14.5.sdk
      echo "Unpacking macOS 14.5 SDK..."
      tar -xf sdk.tar.xz -C /macos-sdk/MacOSX14.5.sdk --strip-components=1

  - id: "build-linux-amd64"
    name: "us-central1-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/golang:1@sha256:3680233e3204827fbdc66088528ae6d4b3d034f51d03a99d454f6de034888244"
    waitFor:
      - "run-tests"
      - "install-zig"
    env:
      - "GOPATH=/gopath"
      - "CGO_ENABLED=1"
      - "GOOS=linux"
      - "GOARCH=amd64"
      - "CC=/zig-tools/zig cc -target x86_64-linux-gnu"
      - "CXX=/zig-tools/zig c++ -target x86_64-linux-gnu"
    volumes:
      - name: "go"
        path: "/gopath"
      - name: "zig"
        path: "/zig-tools"
    script: |
      #!/usr/bin/env bash
      go build -ldflags "-X github.com/googleapis/mcp-toolbox/cmd.buildType=binary -X github.com/googleapis/mcp-toolbox/cmd.commitSha=$(git rev-parse --short HEAD)" -o toolbox.linux.amd64

