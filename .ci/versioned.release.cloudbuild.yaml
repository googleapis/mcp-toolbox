      - "EXIT_GATE_MANIFEST_BUCKET=$_EXIT_GATE_MANIFEST_BUCKET"
      - "PUSH_TO_EXIT_GATES=$_PUSH_TO_EXIT_GATES"
    script: |
      #!/usr/bin/env bash
      bash .ci/trigger_exit_gate.sh npm

  - id: "publish-pypi-to-ar"
    name: "us-central1-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/python:3.12@sha256:4d1caded1f729ae443eb803f26ffde7b61e696aeaef62f099abb6dd6b14257c7"
    waitFor:
      - "build-linux-amd64"
      - "build-darwin-arm64"
      - "build-darwin-amd64"
      - "build-windows-amd64"
      - "build-windows-arm64"
    script: |
      #!/usr/bin/env bash
      bash .ci/publish_pypi_to_ar.sh

  - id: "trigger-exit-gate-pypi"
    name: "gcr.io/cloud-builders/gcloud:latest"
    waitFor:
      - "publish-pypi-to-ar"
    env:
      - "BUILD_ID=$BUILD_ID"
      - "EXIT_GATE_PROJECT=$_EXIT_GATE_PROJECT"
      - "EXIT_GATE_MANIFEST_BUCKET=$_EXIT_GATE_MANIFEST_BUCKET"
      - "PUSH_TO_EXIT_GATES=$_PUSH_TO_EXIT_GATES"
    script: |
      #!/usr/bin/env bash
      bash .ci/trigger_exit_gate.sh pypi

artifacts:
  images:
    - "${_DOCKER_URI}:latest"
  testResults:
    bucketUri: "gs://${_ASSETS_BUCKET}/test-results/${BUILD_ID}"
    paths:
      - "junit-report.xml"
    format: JUNIT

options:
  requestedVerifyOption: VERIFIED # This ensures provenance is generated
  automapSubstitutions: true
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY # Necessary for custom service account
  pool:
    name: projects/$PROJECT_ID/locations/us-central1/workerPools/run-release # to increase resource for running releases

substitutions:
  _REGION: us-central1
  _AR_HOSTNAME: ${_REGION}-docker.pkg.dev
  _AR_REPO_NAME: toolbox
  _BUCKET_NAME: mcp-toolbox-for-databases
  _UNSIGNED_BUCKET_NAME: mcp-toolbox-for-databases-unsigned
  _ASSETS_BUCKET: toolbox-build-assets
  _DOCKER_URI: ${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPO_NAME}/toolbox
  _PUSH_LATEST: "false" # Substituted in trigger
  _EXIT_GATE_PROJECT: "mcp-toolbox"
  _EXIT_GATE_MANIFEST_BUCKET: "oss-exit-gate-prod-projects-bucket"
  _PUSH_TO_EXIT_GATES: "false"
