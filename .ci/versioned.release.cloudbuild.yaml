steps:
  - id: "secure_content_scan"
    name: "us-central1-docker.pkg.dev/louhi-prod-1/louhi-helper/louhi-helper-v2"
    waitFor: ["-"]
    args:
    - "secure_content_scan"
    - "--allowed_prefixes"
    - "gcr.io/distroless/"
    - "golang:"
    - "https://us-docker.pkg.dev/${_AIRLOCK_AR_PROJECT}/"
    - "https://us-go.pkg.dev/${_AIRLOCK_AR_PROJECT}/"
    - "https://us-apt.pkg.dev/projects/${_AIRLOCK_AR_PROJECT}/"
    - "https://storage.googleapis.com/${_ASSETS_BUCKET}/"
    - "gcr.io/cloud-builders/"
    results:
      - name: "allowed_uri_prefix"
        attestationContent: "allowed_uri_prefix"
        attestationType: "https://bcid.corp.google.com/build-content-restrictions/v0.1"

  - id: "setup-airlock-auth"
    name: "gcr.io/cloud-builders/gcloud:latest"
    waitFor: ["-"]
    script: |
      #!/usr/bin/env bash
      set -e
      EXPECTED_TAG="v$(cat ./cmd/version.txt)"
      if [[ "${TAG_NAME}" != "${EXPECTED_TAG}" ]]; then
        echo "ERROR: TAG_NAME ('${TAG_NAME}') does not match v\$(cat ./cmd/version.txt) ('${EXPECTED_TAG}')" >&2
        exit 1
      fi
      TOKEN=$(gcloud auth print-access-token)
      
      # Write auth files to the persistent /workspace directory
      echo "machine us-go.pkg.dev login oauth2accesstoken password $TOKEN" > /workspace/.netrc

      echo "$TOKEN" > /workspace/.airlock_token

  - id: "install-dependencies"
    name: "us-docker.pkg.dev/${_AIRLOCK_AR_PROJECT}/docker-3p-trusted/golang@sha256:0ecdc2a9f6156af6451080bfe3d8382a662fcc4e209608c6f919e643453514c1"
    waitFor: 
      - "setup-airlock-auth"
    env:
      - "GOPATH=/gopath"
      - "HOME=/workspace"
      - "GOPROXY=https://us-go.pkg.dev/${_AIRLOCK_AR_PROJECT}/golang-3p-trusted,https://us-go.pkg.dev/${_AIRLOCK_AR_PROJECT}/golang-3p-l1,https://us-go.pkg.dev/${_AIRLOCK_AR_PROJECT}/ah-3p-staging-golang"
      - "GONOSUMDB=*"
    volumes:
      - name: "go"
        path: "/gopath"
    script: |
      go get -d ./...

  - id: "run-tests"
    name: "us-docker.pkg.dev/${_AIRLOCK_AR_PROJECT}/docker-3p-trusted/golang@sha256:0ecdc2a9f6156af6451080bfe3d8382a662fcc4e209608c6f919e643453514c1"
    waitFor:
      - "install-dependencies"
    env:
      - "GOPATH=/gopath"
      - "HOME=/workspace"
      - "GOPROXY=https://us-go.pkg.dev/${_AIRLOCK_AR_PROJECT}/golang-3p-trusted,https://us-go.pkg.dev/${_AIRLOCK_AR_PROJECT}/golang-3p-l1,https://us-go.pkg.dev/${_AIRLOCK_AR_PROJECT}/ah-3p-staging-golang"
      - "GONOSUMDB=*"
    volumes:
      - name: "go"
        path: "/gopath"
    script: |
      #!/usr/bin/env bash
      set -eo pipefail

      echo "Installing go-junit-report..."
      go install github.com/jstemmer/go-junit-report/v2@v2.1.0

      echo "Running unit tests and generating JUnit XML report..."
      go test -race -v ./cmd/... ./internal/... 2>&1 | tee /dev/stderr | $(go env GOPATH)/bin/go-junit-report -set-exit-code > in-progress-junit-report.xml

      # If the previous command failed, this will never be renamed and thus not uploaded
      mv in-progress-junit-report.xml junit-report.xml

  - id: "install-zig"
    name: "gcr.io/cloud-builders/gcloud:latest"
    waitFor: ["setup-airlock-auth"]
    volumes:
      - name: "zig"
        path: "/zig-tools"
    script: |
      #!/usr/bin/env bash
      set -e
      bash .ci/setup_apt.sh ${_AIRLOCK_AR_PROJECT} && apt-get update && apt-get install -y xz-utils
      echo "Downloading Zig..."
      gcloud storage cp gs://${_ASSETS_BUCKET}/dependencies/zig-x86_64-linux-0.15.2.tar.xz zig.tar.xz
      echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  zig.tar.xz" | sha256sum -c -

      mkdir -p /zig-tools
      echo "Unpacking Zig..."
      tar -xf zig.tar.xz -C /zig-tools --strip-components=1

  - id: "build-docker"
    name: "gcr.io/cloud-builders/docker"
    env:
      - "GOPROXY=https://us-go.pkg.dev/${_AIRLOCK_AR_PROJECT}/golang-3p-trusted,https://us-go.pkg.dev/${_AIRLOCK_AR_PROJECT}/golang-3p-l1,https://us-go.pkg.dev/${_AIRLOCK_AR_PROJECT}/ah-3p-staging-golang"
      - "GONOSUMDB=*"
    waitFor:
      - "run-tests"
      - "install-zig"
    script: |
      #!/usr/bin/env bash
      set -e

      docker buildx create --name container-builder --driver docker-container --driver-opt network=cloudbuild --bootstrap --use

      # Build OCI archive for Cloud Build artifacts.oci upload
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --build-arg BASE_IMAGE="us-docker.pkg.dev/${_AIRLOCK_AR_PROJECT}/docker-3p-trusted/golang@sha256:0ecdc2a9f6156af6451080bfe3d8382a662fcc4e209608c6f919e643453514c1" \
        --build-arg BUILD_TYPE=container.release \
        --build-arg GOPROXY=${GOPROXY} \
        --build-arg GONOSUMDB=${GONOSUMDB} \
        --build-arg COMMIT_SHA=$(git rev-parse --short HEAD) \
        --secret id=airlock_token,src=/workspace/.airlock_token \
        --provenance=false \
        --output=type=oci,dest=/workspace/image.tar .

  - id: "install-macos-sdk"
    name: "gcr.io/cloud-builders/gcloud:latest"
    waitFor: ["setup-airlock-auth"]
    volumes:
      - name: "macos-sdk"
        path: "/macos-sdk"
    script: |
      #!/usr/bin/env bash
      set -e
      bash .ci/setup_apt.sh ${_AIRLOCK_AR_PROJECT} && apt-get update && apt-get install -y xz-utils
      echo "Downloading macOS 14.5 SDK..."
      gcloud storage cp gs://${_ASSETS_BUCKET}/MacOSX14.5.tar.xz sdk.tar.xz

      mkdir -p /macos-sdk/MacOSX14.5.sdk
      echo "Unpacking macOS 14.5 SDK..."
      tar -xf sdk.tar.xz -C /macos-sdk/MacOSX14.5.sdk --strip-components=1

  - id: "build-linux-amd64"
    name: "us-docker.pkg.dev/${_AIRLOCK_AR_PROJECT}/docker-3p-trusted/golang@sha256:0ecdc2a9f6156af6451080bfe3d8382a662fcc4e209608c6f919e643453514c1"
    waitFor:
      - "run-tests"
      - "install-zig"
    env:
      - "GOPATH=/gopath"
      - "CGO_ENABLED=1"
      - "GOOS=linux"
      - "GOARCH=amd64"
      - "CC=/zig-tools/zig cc -target x86_64-linux-gnu"
      - "CXX=/zig-tools/zig c++ -target x86_64-linux-gnu"
    volumes:
      - name: "go"
        path: "/gopath"
      - name: "zig"
        path: "/zig-tools"
    script: |
      #!/usr/bin/env bash
      go build -ldflags "-X github.com/googleapis/mcp-toolbox/cmd.buildType=binary -X github.com/googleapis/mcp-toolbox/cmd.commitSha=$(git rev-parse --short HEAD)" -o toolbox.linux.amd64

  - id: "store-linux-amd64"
