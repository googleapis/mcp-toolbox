steps:
  - id: "promote-docker"
    name: "gcr.io/cloud-builders/gcloud:latest"
    waitFor: ["-"]
    script: |
      #!/usr/bin/env bash
      set -eo pipefail
      export VERSION=$(cat ./cmd/version.txt)
      STAGING_IMAGE_URI="${_AR_HOSTNAME}/${PROJECT_ID}/${_STAGING_AR_REPO_NAME}/toolbox"

      IMAGE_DIGEST=$(gcloud artifacts docker tags list "${STAGING_IMAGE_URI}" \
        --project="${PROJECT_ID}" \
        --filter="tag ~ /tags/(v?${VERSION})$" \
        --format="value(version)" | head -n 1)

      if [[ -z "${IMAGE_DIGEST}" ]]; then
        echo "ERROR: Could not resolve image digest for ${STAGING_IMAGE_URI}:${VERSION}" >&2
        exit 1
      fi

      curl -fsSL -X POST \
        -H "Authorization: Bearer $(gcloud auth print-access-token)" \
        -H "Content-Type: application/json" \
        "https://artifactregistry.googleapis.com/v1/projects/${PROJECT_ID}/locations/${_REGION}/repositories/${_PROD_AR_REPO_NAME}:promoteArtifact" \
        -d "{
          \"source_repository\": \"projects/${PROJECT_ID}/locations/${_REGION}/repositories/${_STAGING_AR_REPO_NAME}\",
          \"source_version\": \"projects/${PROJECT_ID}/locations/${_REGION}/repositories/${_STAGING_AR_REPO_NAME}/packages/toolbox/versions/${IMAGE_DIGEST}\",
          \"attachment_behavior\": \"PUBLIC_BCID_VSA_ONLY\",
          \"include_all_tags\": true,
          \"overwrite_tags\": true
        }"

  - id: "publish-npm-to-ar"
    name: node:20
    waitFor:
      - "promote-docker"
    script: |
      #!/usr/bin/env bash
      bash .ci/publish_npm_to_ar.sh

  - id: "trigger-exit-gate-npm"
    name: "gcr.io/cloud-builders/gcloud:latest"
    waitFor:
      - "publish-npm-to-ar"
    env:
      - "BUILD_ID=$BUILD_ID"
      - "EXIT_GATE_PROJECT=$_EXIT_GATE_PROJECT"
      - "EXIT_GATE_MANIFEST_BUCKET=$_EXIT_GATE_MANIFEST_BUCKET"
      - "PUSH_TO_EXIT_GATES=$_PUSH_TO_EXIT_GATES"
    script: |
      #!/usr/bin/env bash
      bash .ci/trigger_exit_gate.sh npm

  - id: "publish-pypi-to-ar"
    name: python:3.12
    waitFor:
      - "promote-docker"
    script: |
      #!/usr/bin/env bash
      bash .ci/publish_pypi_to_ar.sh

  - id: "trigger-exit-gate-pypi"
    name: "gcr.io/cloud-builders/gcloud:latest"
    waitFor:
      - "publish-pypi-to-ar"
    env:
      - "BUILD_ID=$BUILD_ID"
      - "EXIT_GATE_PROJECT=$_EXIT_GATE_PROJECT"
      - "EXIT_GATE_MANIFEST_BUCKET=$_EXIT_GATE_MANIFEST_BUCKET"
      - "PUSH_TO_EXIT_GATES=$_PUSH_TO_EXIT_GATES"
    script: |
      #!/usr/bin/env bash
      bash .ci/trigger_exit_gate.sh pypi

options:
  automapSubstitutions: true
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
  pool:
    name: projects/$PROJECT_ID/locations/us-central1/workerPools/run-release

substitutions:
  _REGION: us-central1
  _AR_HOSTNAME: ${_REGION}-docker.pkg.dev
  _STAGING_AR_REPO_NAME: toolbox-containers-staging
  _PROD_AR_REPO_NAME: toolbox
  _EXIT_GATE_PROJECT: "mcp-toolbox"
  _EXIT_GATE_MANIFEST_BUCKET: "oss-exit-gate-prod-projects-bucket"
  _PUSH_TO_EXIT_GATES: "false"
