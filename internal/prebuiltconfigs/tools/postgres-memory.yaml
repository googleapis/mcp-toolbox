kind: source
name: postgresql-source
type: postgres
host: ${POSTGRES_HOST:localhost}
port: ${POSTGRES_PORT:5432}
database: ${POSTGRES_DATABASE}
user: ${POSTGRES_USER}
password: ${POSTGRES_PASSWORD}
queryParams: ${POSTGRES_QUERY_PARAMS:}
---
kind: tool
name: create_memory
type: postgres-create-memory
source: postgresql-source
defaultUserId: ${TOOLBOX_MEMORY_DEFAULT_USER_ID:default}
---
kind: group
name: memory
description: Use these tools to persist, query, and manage long-term agent memories across sessions.
tools:
- create_memory
