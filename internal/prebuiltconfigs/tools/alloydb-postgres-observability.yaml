kind: tool
name: get_advanced_time_series_wait_event_stats
type: databaseinsights-get-advanced-time-series-wait-event-stats
source: database-insights-source
description: |
  Fetches time-series history of wait event statistics to analyze contention trends for a requested AlloyDB instance within a specified time period. Supports filtering by database name, database user, and a specific query ID, as well as selecting the aggregation level (by wait class or granular wait event). Returns time-series data including rate of time spent (rate(time_spent)) grouped by wait class or event. Requires advanced query insights to be enabled.
  Intent Interpretation Rules
    - If the user asks for "trend", "overview", "pattern", or "high-level analysis": Use view = WAIT_CLASS (default), EVEN if they say "wait events".
    - Only use view = WAIT_EVENT when the user explicitly asks for:
      - "detailed wait events"
      - "specific wait event names"
      - "granular breakdown"
      - or mentions specific wait events (e.g., "ClientWrite", "DataFileRead")
    - If a query_id is provided WITHOUT explicit request for granularity default to WAIT_CLASS
    - Phrase "wait events trend" should be interpreted as high-level category trend (WAIT_CLASS), NOT individual event types
    - When in doubt: Prefer WAIT_CLASS (more readable and useful for analysis)
  Use Cases:
    - Analyze Periodic Contention: "Show me the wait event history for the last 4 hours on instance 'primary-1'. Is there a spike in IO or Locks every hour?"
    - Query-Level Bottleneck Evolution: "For query hash -4318400215895414374, show me the trend of its wait events over the last day."
    - Correlate Traffic with Lock Contention: "Get the wait event history for user 'app_backend' in 'prod_db' between 9 AM and 11 AM today."
  **REQUIRED PARAMETERS (Mandatory):**
    1. 'parent': Project and location. Format: projects/{project_id}/locations/{location}
    2. 'full_resource_name': The full identifier for the AlloyDB instance. Format: //alloydb.googleapis.com/projects/{project_id}/locations/{location}/clusters/{cluster_id}/instances/{instance_id}
  **OPTIONAL PARAMETERS (Additional Filters):**
    - 'start_time': Beginning of the interval for fetching history in RFC3339 format (Defaults to 1 hour ago).
    - 'end_time': End of the interval for fetching history in RFC3339 format (Defaults to 'now').
    - 'database': Filter history to a specific database.
    - 'username': Filter history to a specific database user.
    - 'query_id': Breakdown wait events over time for a specific query hash.
    - 'view': Aggregation level. Use 'WAIT_CLASS' for high-level categories (e.g., Lock, IO) or 'WAIT_EVENT' for granular details (e.g., ClientWrite, DataFileRead). Defaults to 'WAIT_CLASS'.
  Response:
    A dataset of time-series points showing the rate of time spent in various wait states.
    **UNIT AND FORMATTING RULES:**
      1. **Wait times**: The rate of time spent is in microseconds.
         ALWAYS report these values, rounded to two decimal places, in **milliseconds** (ms) if less than 1 second, or in **seconds** (s) if 1 second or more.
         Example: 1112.3 microseconds should be reported as 1.11 ms.
