kind: tool
name: get_advanced_aggregated_query_stats
type: databaseinsights-get-advanced-aggregated-query-stats
source: database-insights-source
description: |
  Fetches aggregated query execution statistics for a requested AlloyDB instance within a specified time period. Supports filtering by database name, database user, and a specific query ID, as well as pagination. Returns statistics including query ID, database name, total execution time (sum(execution_time)), average execution time (avg(execution_time)), total execution count (sum(count)), total wait time (sum(wait_time)), and normalized query text. Requires advanced query insights to be enabled.
  **IMPORTANT:**
    Use these parameters to narrow down the results as requested by the user.
    - If the user asks for a specific number of results (e.g., "Top 10", "First 5", "List 50"), map that number directly to page_size.
    - If they ask for a specific user or database, use the corresponding arguments.
    - When fetching results for a time range (e.g., "last 24 hours"), you MUST calculate and provide EXPLICIT 'start_time' AND 'end_time' in RFC3339 format. This pins the data window so that 'page_token' remains valid for subsequent requests. If 'page_token' is present, 'start_time' and 'end_time' MUST match the initial request.
  Use Cases:
    - Identify top queries: "I want execution details about top queries executed on database <database_name> on instance <instance_id> in the last 6 hours."
    - Monitor specific user activity: "What were the top queries run by user <user_name> in the last hour?"
  **REQUIRED PARAMETERS (Mandatory):**
    1. 'parent': Project and location. Format: projects/{project_id}/locations/{location}
    2. 'full_resource_name': The full identifier for the AlloyDB instance. Provide the full resource name ONLY in the following format: //alloydb.googleapis.com/projects/{project_id}/locations/{location}/clusters/{cluster_id}/instances/{instance_id}
  **OPTIONAL PARAMETERS (Additional Filters):**
    - 'start_time': Beginning of the interval for fetching stats in RFC3339 format (Defaults to 1 hour ago).
    - 'end_time': End of the interval for fetching stats in RFC3339 format (Defaults to 'now').
    - 'database': Filter results to a specific database name.
    - 'username': Filter results to a specific database user.
    - 'query_id': Fetch aggregated statistics for a single, specific query hash.
    - 'page_size': Maximum number of query stats to return (Default: 20).
    - 'page_token': Token for fetching the next set of results.
  Response:
    Returns a ranked list of queries with metrics: sum(execution_time), sum(count), avg(execution_time), sum(wait_time), and normalized_query_text.
    **UNIT AND FORMATTING RULES:**
      1. **Execution and Wait times**: Metrics like 'sum(execution_time)', 'avg(execution_time)', and 'sum(wait_time)' are in microseconds.
         ALWAYS report these values, rounded to two decimal places, in **milliseconds** (ms) if less than 1 second, or in **seconds** (s) if 1 second or more.
