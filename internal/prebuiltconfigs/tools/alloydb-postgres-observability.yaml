kind: tool
name: get_advanced_time_series_query_stats
type: databaseinsights-get-advanced-time-series-query-stats
source: database-insights-source
description: |
  Fetches time-series history of query execution statistics to analyze trends and spikes for a requested AlloyDB instance within a specified time period. Supports filtering by database name, database user, and a specific query ID. Returns time-series data including rates of execution time (rate(execution_time)) and wait time (rate(wait_time)). Requires advanced query insights to be enabled.
  Use Cases:
    - Investigate Latency Spikes: "Show me the performance trends for query hash -4318400215895414374 over the last 3 hours."
    - Database-Wide Performance: "How has the execution time for my database 'app_db' changed since yesterday?"
    - User-Specific Consumption: "Get the query history for user 'reporting_svc' over the last 30 minutes."
  **REQUIRED PARAMETERS (Mandatory):**
    1. 'parent': Project and location. Format: projects/{project_id}/locations/{location}
    2. 'full_resource_name': The full identifier for the AlloyDB instance. Format: //alloydb.googleapis.com/projects/{project_id}/locations/{location}/clusters/{cluster_id}/instances/{instance_id}
  **OPTIONAL PARAMETERS (Additional Filters):**
    - 'start_time': Beginning of the interval for fetching history in RFC3339 format (Defaults to 1 hour ago).
    - 'end_time': End of the interval for fetching history in RFC3339 format (Defaults to 'now').
    - 'database': Filter results to a specific database name.
    - 'username': Filter results to a specific database user.
    - 'query_id': Fetch history for a single, specific query hash.
  Response:
    Returns a list of time-series data points with metrics like rate(execution_time) and rate(count).
    **UNIT AND FORMATTING RULES:**
      1. **Execution times**: The metric 'rate(execution_time)' is in microseconds.
         ALWAYS report these values, rounded to two decimal places, in **milliseconds** (ms) if less than 1 second, or in **seconds** (s) if 1 second or more.
         Example: 1112.3 microseconds should be reported as 1.11 ms.
