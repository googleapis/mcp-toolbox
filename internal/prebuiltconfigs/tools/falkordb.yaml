kind: source
name: falkordb-source
type: falkordb
host: ${FALKORDB_HOST}
port: ${FALKORDB_PORT:6379}
username: ${FALKORDB_USERNAME:}
password: ${FALKORDB_PASSWORD:}
graph: ${FALKORDB_GRAPH}
---
kind: tool
name: execute_cypher
type: falkordb-execute-cypher
source: falkordb-source
description: Use this tool to execute Cypher queries against the FalkorDB graph.
---
kind: tool
name: get_schema
type: falkordb-schema
source: falkordb-source
description: Use this tool to get the graph schema.
---
kind: tool
name: list_graphs
type: falkordb-list-graphs
source: falkordb-source
description: Use this tool to list the graphs stored in the FalkorDB instance.
---
kind: toolset
name: falkordb_database_tools
tools:
- execute_cypher
- get_schema
- list_graphs
