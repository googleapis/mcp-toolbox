kind: source
name: cloudsql-pg-source
type: cloud-sql-postgres
project: ${CLOUD_SQL_POSTGRES_PROJECT}
region: ${CLOUD_SQL_POSTGRES_REGION}
instance: ${CLOUD_SQL_POSTGRES_INSTANCE}
database: ${CLOUD_SQL_POSTGRES_DATABASE}
user: ${CLOUD_SQL_POSTGRES_USER:}
password: ${CLOUD_SQL_POSTGRES_PASSWORD:}
ipType: ${CLOUD_SQL_POSTGRES_IP_TYPE:public}
readOnly: ${CLOUD_SQL_POSTGRES_READONLY:false}
---
kind: tool
name: create_memory
type: postgres-create-memory
source: cloudsql-pg-source
defaultUserId: ${TOOLBOX_MEMORY_DEFAULT_USER_ID:default}
---
kind: tool
name: search_memory
type: postgres-search-memory
source: cloudsql-pg-source
defaultUserId: ${TOOLBOX_MEMORY_DEFAULT_USER_ID:default}
---
kind: tool
name: update_memory
type: postgres-update-memory
source: cloudsql-pg-source
defaultUserId: ${TOOLBOX_MEMORY_DEFAULT_USER_ID:default}
---
kind: group
name: memory
description: Use these tools to persist, query, and manage long-term agent memories across sessions.
tools:
- create_memory
- search_memory
- update_memory
