kind: source
name: looker-source
type: looker
base_url: ${LOOKER_BASE_URL}
client_id: ${LOOKER_CLIENT_ID:}
client_secret: ${LOOKER_CLIENT_SECRET:}
verify_ssl: ${LOOKER_VERIFY_SSL:true}
timeout: 600s
use_client_oauth: ${LOOKER_USE_CLIENT_OAUTH:false}
project: ${LOOKER_PROJECT:}
location: ${LOOKER_LOCATION:}
---
kind: tool
name: ask_data_insights
type: looker-conversational-analytics
source: looker-source
description: |
  Use this tool to ask questions about your data using the Looker Conversational
  Analytics API. You must provide a natural language query and a list of
  1 to 5 model and explore combinations (e.g. [{'model': 'the_model', 'explore': 'the_explore'}]).
  Use the 'get_models' and 'get_explores' tools to discover available models and explores.
---
kind: tool
name: get_models
type: looker-get-models
source: looker-source
description: |
  get_models Tool
  
  This tool retrieves a list of available LookML models in the Looker instance.
  LookML models define the data structure and relationships that users can query.
  The output includes details like the model's `name` and `label`, which are
  essential for subsequent calls to tools like `get_explores` or `query`.
  
  This tool takes no parameters.
---
kind: tool
name: get_explores
type: looker-get-explores
source: looker-source
description: |
  get_explores Tool

  This tool retrieves a list of explores defined within a specific LookML model.
  Explores represent a curated view of your data, typically joining several
  tables together to allow for focused analysis on a particular subject area.
  The output provides details like the explore's `name` and `label`.

  Parameters:
  - model_name (required): The name of the LookML model, obtained from `get_models`.
---
kind: tool
name: create_agent
type: looker-create-agent
source: looker-source
description: |
  Create a new Conversational Analytics Agent.
---
kind: tool
name: delete_agent
type: looker-delete-agent
source: looker-source
description: |
  Delete a Conversational Analytics Agent.
---
kind: tool
name: get_agent
type: looker-get-agent
source: looker-source
description: |
  Retrieve details of a specific Conversational Analytics Agent.
---
kind: tool
name: list_agents
type: looker-list-agents
source: looker-source
description: |
  List all Conversational Analytics Agents.
---
kind: tool
name: update_agent
type: looker-update-agent
source: looker-source
description: |
  Update an existing Conversational Analytics Agent.
---
kind: tool
name: create_conversation
type: looker-create-conversation
source: looker-source
description: |
  Create a new conversation for Conversational Analytics.
---
kind: tool
name: delete_conversation
type: looker-delete-conversation
source: looker-source
description: |
  Delete a conversation.
---
kind: tool
name: get_conversation
type: looker-get-conversation
source: looker-source
description: |
  Retrieve a specific conversation.
---
kind: tool
name: update_conversation
type: looker-update-conversation
source: looker-source
description: |
  Update a conversation.
---
kind: tool
name: list_conversations
type: looker-list-conversations
source: looker-source
description: |
  List or search conversations.
---
kind: tool
name: create_conversation_message
type: looker-create-conversation-message
source: looker-source
description: |
  Create one or more messages in a conversation.
---
kind: tool
name: list_conversation_messages
type: looker-list-conversation-messages
source: looker-source
description: |
  Get all messages in a conversation.
---
kind: tool
name: delete_conversation_message
type: looker-delete-conversation-message
source: looker-source
description: |
  Delete a specific message from a conversation.
---
kind: tool
name: get_conversation_message
type: looker-get-conversation-message
source: looker-source
description: |
  Retrieve a specific message from a conversation.
---
kind: tool
name: update_conversation_message
type: looker-update-conversation-message
source: looker-source
description: |
  Update a specific message in a conversation.
---
kind: tool
name: conversational_analytics_chat
type: looker-conversational-analytics-chat
source: looker-source
description: |
  Send a message to a conversation and get the generated response from the agent.
---
kind: toolset
name: looker_conversational_analytics_tools
tools:
- ask_data_insights
- get_models
- get_explores
- create_agent
- delete_agent
- get_agent
- list_agents
- update_agent
- create_conversation
- delete_conversation
- get_conversation
- update_conversation
- list_conversations
- create_conversation_message
- list_conversation_messages
- delete_conversation_message
- get_conversation_message
- update_conversation_message
- conversational_analytics_chat