kind: source
name: spanner-source
type: spanner
project: ${SPANNER_PROJECT}
instance: ${SPANNER_INSTANCE}
database: ${SPANNER_DATABASE}
dialect: ${SPANNER_DIALECT:googlesql}
---
kind: tool
name: execute_sql
type: spanner-execute-sql
source: spanner-source
description: Execute read-write SQL statements that modify the database (DML), such as INSERT, UPDATE, DELETE, or table alterations. Do not use this tool for standard data queries or SELECT statements. Please use the ${SPANNER_DIALECT:googlesql} interface for Spanner.
---
kind: tool
name: execute_sql_readonly
type: spanner-execute-sql
source: spanner-source
description: Execute read-only SQL queries (DQL) such as SELECT statements, metadata inspections, or information_schema queries. Use this tool as the default for any data retrieval tasks. Please use the ${SPANNER_DIALECT:googlesql} interface for Spanner.
readOnly: true
---
kind: tool
name: list_tables
type: spanner-list-tables
source: spanner-source
description: Lists detailed schema information (object type, columns, constraints, indexes) as JSON for user-created tables (ordinary or partitioned). Filters by a comma-separated list of names. If names are omitted, lists all tables in user schemas. The output can be 'simple' (table names only) or 'detailed' (full schema).
---
kind: tool
name: list_graphs
type: spanner-list-graphs
source: spanner-source
description: Lists detailed graph schema information (node tables, edge tables, labels and property declarations) as JSON for user-created graphs. Filters by a comma-separated list of graph names. If names are omitted, lists all graphs. The output can be 'simple' (graph names only) or 'detailed' (full schema).
---
kind: tool
name: search_catalog
type: spanner-search-catalog
source: spanner-source
description: Searches for data assets (eg. Spanner instances, tables, views, or databases) in catalog based on the provided search query
---
kind: group
name: data
description: Use these skills when you need to explore the database structure, discover schema objects like tables and graphs, and execute custom SQL queries to interact with your data.
tools:
- execute_sql
- execute_sql_readonly
- list_tables
- list_graphs
---
kind: toolset
name: data_with_discovery
tools:
- execute_sql
- execute_sql_readonly
- list_tables
- list_graphs
- search_catalog

