version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    presets:
      - std-error-handling
    rules:
      # The Google Cloud OpenTelemetry exporters backing --telemetry-gcp are
      # deprecated in favor of OTLP. Migrating changes exported metric names,
      # so it is tracked separately from dependency updates.
      - path: internal/telemetry/
        linters:
          - staticcheck
        text: "SA1019: github.com/GoogleCloudPlatform/opentelemetry-operations-go/exporter/"
formatters:
  enable:
    - goimports
  settings:
    gofmt:
      rewrite-rules:
        - pattern: interface{}
          replacement: any
        - pattern: a[b:len(a)]
          replacement: a[b:]
