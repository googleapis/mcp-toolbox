{{- include "mcp-toolbox.validateConfig" . }}
{{- $configSecret := include "mcp-toolbox.configSecretName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-toolbox.fullname" . }}
  labels:
    {{- include "mcp-toolbox.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mcp-toolbox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.config.toolsYaml }}
        checksum/config: {{ .Values.config.toolsYaml | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mcp-toolbox.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mcp-toolbox.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: toolbox
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --address=0.0.0.0
            - --port={{ .Values.server.port }}
            {{- if $configSecret }}
            - --config=/etc/toolbox/{{ .Values.config.secretKey }}
            {{- end }}
            {{- range .Values.config.prebuilt }}
            - --prebuilt={{ . }}
            {{- end }}
            {{- if .Values.config.disableReload }}
            - --disable-reload
            {{- else if and $configSecret .Values.config.pollInterval }}
            - --poll-interval={{ .Values.config.pollInterval }}
            {{- end }}
            {{- with .Values.server.allowedHosts }}
            - --allowed-hosts={{ join "," . }}
            {{- end }}
            {{- with .Values.server.allowedOrigins }}
            - --allowed-origins={{ join "," . }}
            {{- end }}
            {{- with .Values.server.logLevel }}
            - --log-level={{ . }}
            {{- end }}
            {{- with .Values.server.loggingFormat }}
            - --logging-format={{ . }}
            {{- end }}
            {{- range .Values.server.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            # Mount the directory, not a subPath: subPath mounts never receive
            # Secret updates, so --poll-interval would have nothing to see.
            {{- if $configSecret }}
            - name: config
              mountPath: /etc/toolbox
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if $configSecret }}
        - name: config
          secret:
            secretName: {{ $configSecret }}
            items:
              - key: {{ .Values.config.secretKey }}
                path: {{ .Values.config.secretKey }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
