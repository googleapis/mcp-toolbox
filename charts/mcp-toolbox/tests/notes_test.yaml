suite: notes
templates:
  - templates/NOTES.txt
set:
  config.toolsYaml: "kind: source"
tests:
  - it: does not warn for an internal ClusterIP Service
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING: server.allowedHosts is empty"

  - it: warns when exposed through an Ingress without allowedHosts
    set:
      ingress.enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: server.allowedHosts is empty"

  - it: warns when the Service is not ClusterIP without allowedHosts
    set:
      service.type: LoadBalancer
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: server.allowedHosts is empty"

  - it: does not warn when allowedHosts is set
    set:
      ingress.enabled: true
      server.allowedHosts: [toolbox.example.com]
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING: server.allowedHosts is empty"
