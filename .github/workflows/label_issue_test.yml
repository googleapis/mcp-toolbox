name: Label Issue Script Tests

on:
  pull_request:
    paths:
      - '.ci/label_issue*.py'
      - '.github/labels.yaml'
      - '.github/workflows/label_issue_test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Run unit tests
        run: python3 -m unittest discover -s .ci -p 'label_issue_test.py' -v
