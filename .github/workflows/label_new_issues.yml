name: Label New Issues

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to classify (digits only)"
        required: true
        type: string
      dry_run:
        description: "Override DRY_RUN ('true' or 'false'; leave empty to use workflow default)"
        required: false
        default: ""
        type: string

permissions: {}

env:
  DRY_RUN: "true"
  ISSUE: ${{ github.event.issue.number || inputs.issue_number }}

jobs:
  # Reads the issue and asks the model. Cannot write to GitHub.
  classify:
    if: github.repository == 'googleapis/mcp-toolbox'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Ask the model for labels
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .ci/label_issue.py classify --issue "$ISSUE"

  # Applies the labels. Has no model key and uses only the issue's labels, author and label events.
  apply:
    if: github.repository == 'googleapis/mcp-toolbox'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Add the labels the rules allow
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSED: ${{ needs.classify.outputs.labels }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DRY_RUN="${DISPATCH_DRY_RUN:-$DRY_RUN}" \
            python3 .ci/label_issue.py apply --issue "$ISSUE" --labels "$PROPOSED"
