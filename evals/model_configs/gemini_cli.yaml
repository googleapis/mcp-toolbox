# Gemini CLI driving a locally-built Toolbox binary over stdio.
# TOOLBOX_BIN / TOOLBOX_PREBUILT let one config serve every prebuilt config.

gemini_cli_version: "@google/gemini-cli@0.55.1"
generator: gemini_cli

# Also the concurrency limit, and each concurrent agent holds its own toolbox
# child and database connection.
execs_per_minute: 10

env:
  GOOGLE_CLOUD_PROJECT: !ENV ${EVAL_GCP_PROJECT_ID}
  GOOGLE_CLOUD_LOCATION: !ENV ${EVAL_GCP_PROJECT_REGION}
  GOOGLE_GENAI_USE_VERTEXAI: "true"
  GEMINI_MODEL: !ENV ${EVAL_GEMINI_MODEL}
  GEMINI_CLI_TRUST_WORKSPACE: "true"

setup:
  mcp_servers:
    toolbox:
      command: !ENV ${TOOLBOX_BIN}
      args:
        - "--prebuilt"
        - !ENV ${TOOLBOX_PREBUILT}
        - "--stdio"
      # Explicit because the CLI strips inherited env matching
      # /PASSWORD|KEY|TOKEN|SECRET|AUTH|CREDENTIAL|CREDS|PRIVATE|CERT/i before
      # spawning an MCP child. Without this the postgres source falls back to
      # IAM auth and every tool silently disappears.
      env:
        CLOUD_SQL_POSTGRES_PASSWORD: !ENV ${CLOUD_SQL_POSTGRES_PASSWORD}
        CLOUD_SQL_MYSQL_PASSWORD: !ENV ${CLOUD_SQL_MYSQL_PASSWORD}
