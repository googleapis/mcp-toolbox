# Claude Code driving a locally-built Toolbox binary over stdio

claude_code_version: "@anthropic-ai/claude-code@2.1.156"
generator: claude_code

model: !ENV ${EVAL_CLAUDE_MODEL}

# An ANTHROPIC_API_KEY anywhere in the environment silently wins over
# use_vertex, so the build must not set one.
use_vertex: true
vertex_project_id: !ENV ${EVAL_GCP_PROJECT_ID}
vertex_region: "global"

# Also the concurrency limit, and each concurrent agent holds its own toolbox
# child and database connection.
execs_per_minute: 10

env:
  GOOGLE_CLOUD_PROJECT: !ENV ${EVAL_GCP_PROJECT_ID}

setup:
  mcp_servers:
    toolbox:
      command: !ENV ${TOOLBOX_BIN}
      args:
        - "--prebuilt"
        - !ENV ${TOOLBOX_PREBUILT}
        - "--stdio"
      # Listed in full because the MCP SDK gives stdio children a whitelisted
      # environment, not the parent's. Names the selected prebuilt does not
      # read are ignored.
      env:
        CLOUD_SQL_POSTGRES_PROJECT: !ENV ${CLOUD_SQL_POSTGRES_PROJECT}
        CLOUD_SQL_POSTGRES_REGION: !ENV ${CLOUD_SQL_POSTGRES_REGION}
        CLOUD_SQL_POSTGRES_INSTANCE: !ENV ${CLOUD_SQL_POSTGRES_INSTANCE}
        CLOUD_SQL_POSTGRES_DATABASE: !ENV ${CLOUD_SQL_POSTGRES_DATABASE}
        CLOUD_SQL_POSTGRES_USER: !ENV ${CLOUD_SQL_POSTGRES_USER}
        CLOUD_SQL_POSTGRES_PASSWORD: !ENV ${CLOUD_SQL_POSTGRES_PASSWORD}
        CLOUD_SQL_POSTGRES_IP_TYPE: !ENV ${CLOUD_SQL_POSTGRES_IP_TYPE}

        CLOUD_SQL_MYSQL_PROJECT: !ENV ${CLOUD_SQL_MYSQL_PROJECT}
        CLOUD_SQL_MYSQL_REGION: !ENV ${CLOUD_SQL_MYSQL_REGION}
        CLOUD_SQL_MYSQL_INSTANCE: !ENV ${CLOUD_SQL_MYSQL_INSTANCE}
        CLOUD_SQL_MYSQL_DATABASE: !ENV ${CLOUD_SQL_MYSQL_DATABASE}
        CLOUD_SQL_MYSQL_USER: !ENV ${CLOUD_SQL_MYSQL_USER}
        CLOUD_SQL_MYSQL_PASSWORD: !ENV ${CLOUD_SQL_MYSQL_PASSWORD}
        CLOUD_SQL_MYSQL_IP_TYPE: !ENV ${CLOUD_SQL_MYSQL_IP_TYPE}

        ALLOYDB_POSTGRES_PROJECT: !ENV ${ALLOYDB_POSTGRES_PROJECT}
        ALLOYDB_POSTGRES_REGION: !ENV ${ALLOYDB_POSTGRES_REGION}
        ALLOYDB_POSTGRES_CLUSTER: !ENV ${ALLOYDB_POSTGRES_CLUSTER}
        ALLOYDB_POSTGRES_INSTANCE: !ENV ${ALLOYDB_POSTGRES_INSTANCE}
        ALLOYDB_POSTGRES_DATABASE: !ENV ${ALLOYDB_POSTGRES_DATABASE}
        ALLOYDB_POSTGRES_USER: !ENV ${ALLOYDB_POSTGRES_USER}
        ALLOYDB_POSTGRES_PASSWORD: !ENV ${ALLOYDB_POSTGRES_PASSWORD}
