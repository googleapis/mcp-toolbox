kind: source
name: sample-db
type: sqlite
database: ":memory:"
---
kind: resource
name: sales_dashboard
type: file
path: "./ui/dashboard.html"
description: "Interactive sales analytics dashboard."
ui: true
---
kind: tool
name: get_sales_report
type: sqlite-sql
source: sample-db
description: "Retrieves product sales figures and displays them in an interactive dashboard."
statement: |
  SELECT 'Laptops' AS product, 'Electronics' AS category, 120 AS units_sold, 144000.00 AS revenue, 4.8 AS rating
  UNION ALL SELECT 'Smartphones', 'Electronics', 350, 280000.00, 4.6
  UNION ALL SELECT 'Headphones', 'Accessories', 500, 75000.00, 4.4
  UNION ALL SELECT 'Coffee Makers', 'Appliances', 90, 18000.00, 4.7
  UNION ALL SELECT 'Desk Chairs', 'Furniture', 160, 48000.00, 4.3;
ui:
  resource: sales_dashboard
  visibility:
    - model
    - app
